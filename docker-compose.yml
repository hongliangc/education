# 魔法学习王国 — 全栈本地容器栈（roadmap B2 验证）
# 用法：docker compose up -d --build
#   验证：curl http://localhost/api/health
#   停止：docker compose down       （加 -v 连同数据卷一起删）

services:
  openlist-init:
    image: alpine:3.22
    user: "0:0"
    command: ["sh", "-c", "chown -R 1001:1001 /opt/openlist/data"]
    volumes:
      - openlistdata:/opt/openlist/data
    restart: "no"

  openlist:
    image: "${OPENLIST_IMAGE:-openlistteam/openlist:v4.2.2}"
    environment:
      UMASK: "022"
    volumes:
      - openlistdata:/opt/openlist/data
    expose:
      - "5244"
    ports:
      - "127.0.0.1:5244:5244"
    depends_on:
      openlist-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--spider",
          "http://localhost:5244/ping",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: mlk
      POSTGRES_PASSWORD: mlk_dev_pw
      POSTGRES_DB: mlk
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432" # 映射宿主机，方便宿主 npm run dev / prisma studio 连同一个库
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlk -d mlk"]
      interval: 5s
      timeout: 3s
      retries: 12

  web:
    build: .
    environment:
      DATABASE_URL: "postgresql://mlk:mlk_dev_pw@db:5432/mlk?schema=public"
      AUTH_SECRET: "dev-secret-please-replace-in-prod-0123456789abcdef"
      NEXTAUTH_URL: "http://localhost"
      NEXT_PUBLIC_APP_URL: "http://localhost"
      NODE_ENV: "production"
      # 值来自 gitignored .env 的同名变量，不硬编码进本文件；留空则走 mock
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      # ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      # 腾讯云语音（ASR+TTS）；留空则客户端回退 Web Speech
      TENCENT_SECRETID: "${TENCENT_SECRETID:-}"
      TENCENT_SECRETKEY: "${TENCENT_SECRETKEY:-}"
      # 流式 TTS（stream_wsv2）握手需要 AppId（账号级公开标识，非密钥）
      TENCENT_APPID: "${TENCENT_APPID:-1307984055}"
      TTS_CACHE_DIR: "/app/.cache/tts"
      # 大模型音色（扣大模型预付费包）：601009 爱小芊(童趣女声,9情感) / 501009 WeWinny(英文女声)
      TTS_VOICE_ZH: "${TTS_VOICE_ZH:-601009}"
      TTS_VOICE_EN: "${TTS_VOICE_EN:-501009}"
      VIDEO_SOURCE: "${VIDEO_SOURCE:-openlist}"
      OPENLIST_BASE_URL: "${OPENLIST_BASE_URL:-http://openlist:5244}"
      OPENLIST_USERNAME: "${OPENLIST_USERNAME:-}"
      OPENLIST_PASSWORD: "${OPENLIST_PASSWORD:-}"
      OPENLIST_VIDEO_ROOT: "${OPENLIST_VIDEO_ROOT:-/}"
      OPENLIST_CATALOG_FILE: "${OPENLIST_CATALOG_FILE:-/catalog.json}"
      OPENLIST_MAX_VIDEO_QUALITY: "${OPENLIST_MAX_VIDEO_QUALITY:-FHD}"
      OPENLIST_CATALOG_TTL_SEC: "${OPENLIST_CATALOG_TTL_SEC:-600}"
      OPENLIST_PLAY_CACHE_TTL_SEC: "${OPENLIST_PLAY_CACHE_TTL_SEC:-600}"
    expose:
      - "3000"
    volumes:
      - ttscache:/app/.cache/tts
    depends_on:
      openlist:
        condition: service_healthy
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.docker.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy

volumes:
  openlistdata:
  pgdata:
  ttscache:
