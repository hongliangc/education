# 魔法学习王国 — 全栈本地容器栈（roadmap B2 验证）
# 用法：docker compose up -d --build
#   验证：curl http://localhost/api/health
#   停止：docker compose down       （加 -v 连同数据卷一起删）

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: mlk
      POSTGRES_PASSWORD: mlk_dev_pw
      POSTGRES_DB: mlk
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432" # 映射宿主机，方便宿主 npm run dev / prisma studio 连同一个库
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlk -d mlk"]
      interval: 5s
      timeout: 3s
      retries: 12

  web:
    build: .
    environment:
      DATABASE_URL: "postgresql://mlk:mlk_dev_pw@db:5432/mlk?schema=public"
      AUTH_SECRET: "dev-secret-please-replace-in-prod-0123456789abcdef"
      NEXTAUTH_URL: "http://localhost"
      NEXT_PUBLIC_APP_URL: "http://localhost"
      NODE_ENV: "production"
      # 值来自 gitignored .env 的同名变量，不硬编码进本文件；留空则走 mock
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      # ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.docker.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy

volumes:
  pgdata:
