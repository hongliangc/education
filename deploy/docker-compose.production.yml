services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: mlk
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: mlk
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlk -d mlk"]
      interval: 5s
      timeout: 3s
      retries: 12

  web:
    image: "${DOCKER_IMAGE:-hlc2012/mlk}:${IMAGE_TAG:-latest}"
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DATABASE_URL: "postgresql://mlk:${POSTGRES_PASSWORD}@db:5432/mlk?schema=public"
      AUTH_SECRET: "${AUTH_SECRET}"
      NEXTAUTH_URL: "${PUBLIC_URL:-http://kidora.cn}"
      NEXT_PUBLIC_APP_URL: "${PUBLIC_URL:-http://kidora.cn}"
      NODE_ENV: "production"
      TTS_CACHE_DIR: "/app/.cache/tts"
    expose:
      - "3000"
    volumes:
      - ttscache:/app/.cache/tts
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.production.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy

volumes:
  pgdata:
  ttscache:
