services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: mlk
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: mlk
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlk -d mlk"]
      interval: 5s
      timeout: 3s
      retries: 12

  # OpenList 代理阿里云盘，作为视频影院后端。阿里云盘 OAuth（client/secret/refresh_token）
  # 在 OpenList 后台一次性配置，数据存 openlistdata 卷 —— token 不进 .env.production / 镜像 / Git。
  # 仅 127.0.0.1:5244 回环暴露（公网不可达），方便 SSH 隧道进后台配置存储；web 走内网 openlist:5244。
  openlist-init:
    image: alpine:3.22
    user: "0:0"
    command: ["sh", "-c", "chown -R 1001:1001 /opt/openlist/data"]
    volumes:
      - openlistdata:/opt/openlist/data
    restart: "no"

  openlist:
    image: "${OPENLIST_IMAGE:-openlistteam/openlist:v4.2.2}"
    restart: unless-stopped
    environment:
      UMASK: "022"
    volumes:
      - openlistdata:/opt/openlist/data
    expose:
      - "5244"
    ports:
      - "127.0.0.1:5244:5244"
    depends_on:
      openlist-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5244/ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    image: "${DOCKER_IMAGE:-hlc2012/mlk}:${IMAGE_TAG:-latest}"
    restart: unless-stopped
    env_file:
      - "${APP_ENV_FILE:-.env.production}"
    environment:
      DATABASE_URL: "postgresql://mlk:${POSTGRES_PASSWORD}@db:5432/mlk?schema=public"
      AUTH_SECRET: "${AUTH_SECRET}"
      NEXTAUTH_URL: "${PUBLIC_URL:-http://kidora.cn}"
      NEXT_PUBLIC_APP_URL: "${PUBLIC_URL:-http://kidora.cn}"
      NODE_ENV: "production"
      TTS_CACHE_DIR: "/app/.cache/tts"
      # 流式 TTS(stream_wsv2)握手需要 AppId（账号级公开标识，非密钥）；不设则精灵语音回退
      # 非流式合成、每段先试流式再重合成 → 卡。账号 AppId=1307984055。
      TENCENT_APPID: "${TENCENT_APPID:-1307984055}"
      # 视频影院后端：走内网访问同栈 OpenList 容器。管理员账号在 .env.production
      # 设 OPENLIST_USERNAME/PASSWORD；BASE_URL 是内网常量，固定在此、不进 .env.production。
      OPENLIST_BASE_URL: "http://openlist:5244"
    expose:
      - "3000"
    volumes:
      - ttscache:/app/.cache/tts
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.production.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy

volumes:
  pgdata:
  openlistdata:
  ttscache:
