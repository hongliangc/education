# 本地 HTTPS 预览用的 nginx 配置（Phase 1，mkcert 自签可信证书）。
# 只在 `release.sh local` 经 COMPOSE_OVERLAY 叠加时使用；现网不挂它。
# 80 端口只做一件事：把误入明文的访客 301 到 https（app 内容只在 443 出，
# 因为 http 不是 secure context，getUserMedia 拿不到麦克风——这正是本方案的目标）。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # 健康检查走 http（本地部署脚本从 WSL 探活，netsh 端口转发还没建时也能通），
    # 其余一律 301 到 https（app 内容只在安全上下文出，才能拿麦克风）。
    location = /api/health {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto http;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    client_max_body_size 20m;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # 证书由设备端信任（桌面/手机装 mkcert rootCA）。HSTS 对 IP 字面量浏览器会忽略，
    # 仅作标准加固；按 IP 访问时每次明文进入仍走上面的 301，功能不受影响。
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_buffering off;
        proxy_read_timeout 300s;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
