# 本地 HTTPS overlay（Phase 1，mkcert）。仅 `release.sh local` 经 COMPOSE_OVERLAY 叠加在
# docker-compose.production.yml 之上；现网部署不包含本文件，prod 配置零改动。
#
# 用 !override 整体替换 nginx 的 ports / volumes（默认是 list 拼接，会和基础栈的 80 端口
# 与 default.conf 挂载冲突），从而：加开 443、换成 nginx.https.conf、挂载 mkcert 证书。
services:
  nginx:
    ports: !override
      - "80:80"
      - "443:443"
    volumes: !override
      - ./deploy/nginx.https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
