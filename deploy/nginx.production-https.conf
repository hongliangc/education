# 现网 HTTPS 的 nginx 配置（Phase 2）。只在 prod 经 COMPOSE_OVERLAY=deploy/docker-compose.https.prod.yml
# 叠加时使用；不设 overlay 时仍用 80-only 的 nginx.production.conf（local 预览 / 回滚都不受影响）。
#
# 证书在 /etc/nginx/tls（容器内），由 scripts/setup-prod-tls.sh 维护在宿主 /opt/kidora/tls：
# 先放自签 bootstrap 让 nginx 能起来，certbot 用 Let's Encrypt 签到 IP 证书后替换、reload；
# 之后续签钩子自动更新 + reload。ACME http-01 挑战经 80 的 /.well-known/acme-challenge/ 走 webroot。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name kidora.cn www.kidora.cn 119.91.153.49;
    client_max_body_size 20m;

    # Let's Encrypt http-01 验证 + 续签（webroot；不能 301，否则挑战取不到）。
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
    }

    # 部署脚本从服务器本机探活，走 http 不受证书状态影响。
    location = /api/health {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto http;
    }

    # 其余一律 301 到 https（app 内容只在安全上下文出，才能拿麦克风）。
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name kidora.cn www.kidora.cn 119.91.153.49;
    client_max_body_size 20m;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_buffering off;
        proxy_read_timeout 300s;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
