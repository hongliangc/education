# 魔法学习王国 — Nginx 反向代理（生产，参考 roadmap B2）
# 放置：/etc/nginx/sites-available/mlk，软链到 sites-enabled，
#       sudo nginx -t && sudo systemctl reload nginx
# SSL 由 certbot 自动写入证书路径：
#       sudo certbot --nginx -d yourdomain.com -d www.yourdomain.com
# 占位（yourdomain.com）上线前替换。

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;
    # 强制跳 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name yourdomain.com www.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

    # 上传留点余量（做视频板块 B5 时再调大）
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ⚠️ 精灵对话若改 SSE 流式输出，这两行必须保留：
        # 关闭缓冲，流式 token 才能实时下发，否则会被 Nginx 攒着一次性吐
        proxy_buffering off;
        proxy_read_timeout 300s;

        # WebSocket / upgrade（保险起见保留）
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
